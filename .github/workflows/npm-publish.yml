name: Playwright Tests
on:
  workflow_dispatch:
    inputs:
      course:
        description: 'Enter the course name'
        required: true
        type: choice
        options:
          - Fundamentals of Ecommerce (CSIT334)-Semester V
          - Introduction to Artificial Intelligence (CSIT361)-Semester V
          - Professional Ethics (PFE301)-Semester V
      module:
        description: 'Select the module name'
        required: true
        type: choice
        options:
          - Module 1
          - Module 2
          - Module 3
          - Module 4
          - Module 5
      timeout:
        description: 'Enter the timeout in milliseconds'
        required: false
        default: '600000'
      start_index:
        description: 'Enter the start activity number'
        required: false
        type: number
        default: 0
      max_retries:
        description: 'Maximum retries for API calls'
        required: false
        type: number
        default: 3
      record_video:
        description: 'Record video of test run'
        required: false
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.7.0'
      
      - name: Cache npm dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.npm
            node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      
      - name: Install dependencies
        run: npm ci
      
      - name: Cache Playwright browsers
        uses: actions/cache@v3
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      
      - name: Install Playwright browsers
        run: |
          npx playwright install --with-deps chromium
          # Install system dependencies for GitHub Actions
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 \
            libnspr4 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libcups2 \
            libxkbcommon0 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxrandr2 \
            libgbm1 \
            libasound2
      
      - name: Prepare output folders
        run: |
          rm -rf screenshots test-results playwright-report
          mkdir -p screenshots test-results
          rm -f quiz-log.json progress.json
      
      - name: Run Playwright tests with retry
        id: test
        env:
          CI: true
          USER_NAME: ${{ secrets.USERNAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
          URL: ${{ secrets.URL }}
          COURSE: ${{ github.event.inputs.course }}
          MODULE: ${{ github.event.inputs.module }}
          TIMEOUT: ${{ github.event.inputs.timeout }}
          START_ACTIVITY: ${{ github.event.inputs.start_index }}
          MAX_RETRIES: ${{ github.event.inputs.max_retries }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          RECORD_VIDEO: ${{ github.event.inputs.record_video }}
          RECORD_TRACE: 'false'
          # Playwright specific for GitHub Actions
          PLAYWRIGHT_BROWSERS_PATH: '0'
          DEBUG: 'pw:browser'
        run: |
          MAX_ATTEMPTS=2
          ATTEMPT=1
          
          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "Test attempt $ATTEMPT of $MAX_ATTEMPTS"
            
            if npx playwright test \
              --config=playwright.config.js \
              --reporter=list,json \
              --output=test-results \
              --max-failures=1; then
              echo "✅ Test passed on attempt $ATTEMPT"
              exit 0
            else
              EXIT_CODE=$?
              echo "❌ Test failed on attempt $ATTEMPT with exit code $EXIT_CODE"
              
              if [ $ATTEMPT -lt $MAX_ATTEMPTS ]; then
                echo "Waiting 10 seconds before retry..."
                sleep 10
              else
                echo "All attempts exhausted"
                exit $EXIT_CODE
              fi
            fi
            
            ATTEMPT=$((ATTEMPT + 1))
          done
      
      - name: Generate test summary
        if: always()
        run: |
          echo "## 📊 Test Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "### Configuration" >> $GITHUB_STEP_SUMMARY
          echo "- **Course**: ${{ github.event.inputs.course }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Module**: ${{ github.event.inputs.module }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Start Activity**: ${{ github.event.inputs.start_index }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Timeout**: ${{ github.event.inputs.timeout }}ms" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "### Results" >> $GITHUB_STEP_SUMMARY
          
          # Check quiz log
          if [ -f quiz-log.json ]; then
            QUIZ_COUNT=$(jq 'length' quiz-log.json 2>/dev/null || echo 0)
            echo "- **Quiz Questions Answered**: $QUIZ_COUNT" >> $GITHUB_STEP_SUMMARY
            
            # Show first few quiz questions
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "#### Sample Quiz Questions" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            jq '.[0:3] | map({question: .question, answer: .geminiAnswer})' quiz-log.json >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "No quiz data"
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Quiz Questions**: No quiz data found" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Check progress log
          if [ -f progress.json ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "#### Progress Log" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            jq '.[-5:] | map({name, status, elapsed})' progress.json >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "No progress data"
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          
          # Test status
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.test.outcome }}" == "success" ]; then
            echo "### ✅ Test Status: **PASSED**" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Test Status: **FAILED**" >> $GITHUB_STEP_SUMMARY
          fi
      
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ github.run_number }}
          path: screenshots/
          retention-days: 7
      
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_number }}
          path: playwright-report/
          retention-days: 7
      
      - name: Upload quiz log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quiz-log-${{ github.run_number }}
          path: |
            quiz-log.json
            progress.json
          retention-days: 30
      
      - name: Upload videos
        if: always() && github.event.inputs.record_video == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: test-videos-${{ github.run_number }}
          path: test-results/**/*.webm
          retention-days: 7
      
      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Test Failed: ${context.workflow} - Run #${context.runNumber}`,
              body: `## Test Failure Report
              
              **Workflow**: ${context.workflow}
              **Run Number**: ${context.runNumber}
              **Course**: ${{ github.event.inputs.course }}
              **Module**: ${{ github.event.inputs.module }}
              
              [View Run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})
              
              Please check the artifacts for screenshots and logs.`,
              labels: ['test-failure', 'automation']
            });
            console.log(`Created issue #${issue.data.number}`);
